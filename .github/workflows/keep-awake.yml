# Keeps the free Render server awake so the first person at a party doesn't wait 30-60 s (REVIEW #7).
# GitHub runs this every 10 minutes for free.
name: Keep the game awake
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS --max-time 90 --retry 2 https://closed-caption.onrender.com/healthz || true
